<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Caderno do Fiado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#1b2a36;--mut:#5d6b76;--line:#d9e1dd;--ac:#0f766e;--acx:#fff;--bad:#b42318;--badbg:#fde8e6;--ok:#17653a;--okbg:#e1f4e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a20;--card:#1b262e;--ink:#e8eef2;--mut:#9aabb6;--line:#2c3b46;--ac:#3fc1b3;--acx:#07211e;--bad:#ff8a7d;--badbg:#3a1f1c;--ok:#7be0a1;--okbg:#17301f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a20;--card:#1b262e;--ink:#e8eef2;--mut:#9aabb6;--line:#2c3b46;--ac:#3fc1b3;--acx:#07211e;--bad:#ff8a7d;--badbg:#3a1f1c;--ok:#7be0a1;--okbg:#17301f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.4 Nunito,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:28px;font-weight:800;margin:8px 0 14px}
h2{font-size:22px;font-weight:800;margin:0}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sum .card{margin:0}.lbl{color:var(--mut);font-size:15px}.big{font-size:26px;font-weight:800}
.bad{color:var(--bad)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:var(--acx);cursor:pointer;min-height:48px}
button.s{background:transparent;color:var(--ac);border:2px solid var(--ac)}
button.d{background:transparent;color:var(--bad);border:2px solid var(--bad)}
button.sm{padding:6px 12px;min-height:38px;font-size:16px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input{font:inherit;width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px}
label{display:block;font-size:15px;color:var(--mut);margin:10px 0 4px}
.cli{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:10px;padding:14px;font-weight:600}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--badbg);color:var(--bad)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.par{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.par.pago{color:var(--mut)}.par.pago .v{text-decoration:line-through}
.it{color:var(--mut);font-size:16px;margin:2px 0}
#m{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#m.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.irow{display:grid;grid-template-columns:1fr 64px 92px 38px;gap:6px;margin-bottom:6px;align-items:center}
.irow button{padding:0;min-height:44px}
textarea{width:100%;min-height:90px;font:14px/1.3 monospace;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px}
.empty{text-align:center;color:var(--mut);padding:28px 8px}
.btn{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:12px;padding:13px 16px;margin-bottom:8px;background:#25d366;color:#06361a}.az{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}.az button{flex:none}button.l{min-height:42px;min-width:42px;padding:4px 11px;background:var(--card);color:var(--ink);border:1px solid var(--line)}button.on{background:var(--ac);color:var(--acx)}
</style>
</head>
<body>
<main id="app"></main>
<div id="m" onclick="if(event.target===this)closeM()"><div class="sheet" id="sh"></div></div>
<script>
var K='caderno-fiado-v1',db={clientes:[]},view={n:'home'},q='',draft=null,letra='',soDeve=false,lim=50,idb=null,pouco=false;
function abrirDB(){return new Promise(function(ok,no){var r=indexedDB.open('fiado',1);r.onupgradeneeded=function(){r.result.createObjectStore('c',{keyPath:'id'})};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}})}
function erroSalvar(){alert('Não consegui salvar. Faça uma cópia de segurança agora.')}
function saveC(c){var t=idb.transaction('c','readwrite');t.objectStore('c').put(c);t.onerror=t.onabort=erroSalvar}
function delC(id){var t=idb.transaction('c','readwrite');t.objectStore('c').delete(id);t.onerror=t.onabort=erroSalvar}
function loadAll(){return new Promise(function(ok){var r=idb.transaction('c','readonly').objectStore('c').getAll();r.onsuccess=function(){ok(r.result)};r.onerror=function(){ok([])}})}
function replaceAll(l){return new Promise(function(ok){var t=idb.transaction('c','readwrite'),s=t.objectStore('c');s.clear();l.forEach(function(c){s.put(c)});t.oncomplete=ok;t.onerror=t.onabort=function(){erroSalvar();ok()}})}
function iniciar(){
  abrirDB().then(function(d){idb=d;return loadAll()}).then(function(l){
    db.clientes=l;var old=null;try{old=JSON.parse(localStorage.getItem(K))}catch(e){}
    if(!l.length&&old&&old.clientes&&old.clientes.length){db.clientes=old.clientes;return replaceAll(old.clientes)}
  }).then(function(){
    render();
    try{navigator.storage.persist();navigator.storage.estimate().then(function(e){if(e.quota&&e.usage/e.quota>0.8){pouco=true;if(view.n==='home')render()}})}catch(e){}
  }).catch(function(){document.getElementById('app').innerHTML='<p class="empty">Este navegador não permite salvar dados. Abra pelo Chrome.</p>'});
}
var R=function(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var hoje=function(){return iso(new Date())};
var diasEntre=function(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)};
var BR=function(i){return i.split('-').reverse().join('/')};
function addM(i,n){var p=i.split('-').map(Number),d=new Date(p[0],p[1]-1+n,1),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(p[2],last));return iso(d)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var num=function(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
var resta=function(p){return Math.max(0,Math.round((p.valor-(p.rec||0))*100)/100)};
function saldo(c){var t=0,v=0,h=hoje();c.compras.forEach(function(x){x.parcelas.forEach(function(p){if(!p.pago){var r=resta(p);t+=r;if(p.venc<h)v+=r}})});return{t:t,v:v}}
function go(n,id){view={n:n,id:id};q='';lim=50;render();window.scrollTo(0,0)}
function openM(h){document.getElementById('sh').innerHTML=h;document.getElementById('m').classList.add('on')}
function closeM(){document.getElementById('m').classList.remove('on')}

var NF=function(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()};
function inicial(c){var l=NF(c.nome.trim()).charAt(0).toUpperCase();return /[A-Z]/.test(l)?l:'#'}
function filtrados(){var nq=NF(q);return db.clientes.filter(function(c){return(!letra||inicial(c)===letra)&&(!nq||NF(c.nome).indexOf(nq)>-1)&&(!soDeve||saldo(c).t>0)}).sort(function(x,y){return x.nome.localeCompare(y.nome,'pt-BR')})}
function setL(l){letra=l;lim=50;render()}
function togDeve(){soDeve=!soDeve;lim=50;render()}
function mais(){lim+=50;lst()}
function atrHTML(){var h=hoje(),L=[];
  db.clientes.forEach(function(c){var v=0,min=null;c.compras.forEach(function(x){x.parcelas.forEach(function(p){if(!p.pago&&p.venc<h){v+=resta(p);if(!min||p.venc<min)min=p.venc}})});if(v>0)L.push({c:c,v:v,min:min})});
  L.sort(function(a,b){return a.min<b.min?-1:1});
  var dias=function(m){return Math.round((new Date(h+'T00:00:00')-new Date(m+'T00:00:00'))/864e5)};
  return'<button class="s sm" onclick="go(\'home\')">← Voltar</button><h1 style="margin-top:14px">Em atraso</h1>'+(L.length?L.map(function(r){return'<div class="card"><div class="row sp"><b>'+esc(r.c.nome)+'</b><b class="bad">'+R(r.v)+'</b></div><div class="lbl">parcela mais antiga: '+BR(r.min)+' ('+dias(r.min)+' dias)</div><div class="row" style="margin-top:8px"><button class="s sm" onclick="go(\'cli\',\''+r.c.id+'\')">Abrir</button>'+(r.c.tel?'<a class="btn" style="margin:0;padding:8px 14px" href="'+zap(r.c)+'" target="_blank" rel="noopener">WhatsApp</a>':'')+'</div></div>'}).join(''):'<div class="empty">Ninguém em atraso.</div>')}
function render(){
  var a=document.getElementById('app');
  if(view.n==='atr')return a.innerHTML=atrHTML();
  if(view.n==='cli'){var c=db.clientes.find(function(x){return x.id===view.id});if(c)return a.innerHTML=cliHTML(c);view={n:'home'}}
  var tot=0,ven=0,n=0;
  db.clientes.forEach(function(c){var s=saldo(c);tot+=s.t;ven+=s.v;if(s.t)n++});
  var az='<button class="l'+(letra?'':' on')+'" onclick="setL(\'\')">Todos</button>'+'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('').map(function(l){return'<button class="l'+(letra===l?' on':'')+'" onclick="setL(\''+l+'\')">'+l+'</button>'}).join('');
  a.innerHTML=(pouco?'<div class="card bad"><b>Pouco espaço no aparelho.</b> Faça uma cópia de segurança e libere espaço.</div>':'')+
  '<h1>Caderno do Fiado</h1>'+
  '<div class="sum"><div class="card"><div class="lbl">A receber</div><div class="big">'+R(tot)+'</div><div class="lbl">'+n+' clientes devendo</div></div>'+
  '<div class="card" onclick="go(\'atr\')" style="cursor:pointer"><div class="lbl">Atrasado › ver quem</div><div class="big '+(ven?'bad':'')+'">'+R(ven)+'</div></div></div>'+
  '<div class="row" style="margin-bottom:10px"><input placeholder="Buscar cliente" value="'+esc(q)+'" oninput="q=this.value;lim=50;lst()" aria-label="Buscar cliente"><button onclick="novoCli()" style="white-space:nowrap">+ Cliente</button></div>'+
  '<div class="az">'+az+'</div>'+
  '<p class="row" style="margin:0 0 12px"><button class="s sm'+(soDeve?' on':'')+'" onclick="togDeve()">Só quem deve</button><button class="s sm" onclick="go(\'atr\')">Ver atrasados</button></p>'+
  '<div id="lst">'+listHTML(filtrados())+'</div>'+
  '<p style="text-align:center;margin-top:24px"><button class="s sm" onclick="backup()">Cópia de segurança</button></p><p class="lbl" style="text-align:center">Versão 4</p>';
}
function lst(){document.getElementById('lst').innerHTML=listHTML(filtrados())}
function listHTML(list){
  if(!db.clientes.length)return'<div class="empty">Nenhum cliente ainda.<br>Toque em “+ Cliente” para começar.</div>';
  if(!list.length)return'<div class="empty">Nenhum cliente encontrado.</div>';
  var h=list.slice(0,lim).map(function(c){var s=saldo(c);
    return'<button class="cli" onclick="go(\'cli\',\''+c.id+'\')"><span>'+esc(c.nome)+(s.v?'<br><span class="tag">atrasado '+R(s.v)+'</span>':'')+'</span><span style="font-size:20px;font-weight:800">'+(s.t?R(s.t):'<span class="tag ok">em dia</span>')+'</span></button>'}).join('');
  h+='<p class="lbl" style="text-align:center">Mostrando '+Math.min(lim,list.length)+' de '+list.length+'</p>';
  if(list.length>lim)h+='<p style="text-align:center"><button class="s" onclick="mais()">Mostrar mais</button></p>';
  return h}
function zap(c){var d=c.tel.replace(/\D/g,'');if(d.length<=11)d='55'+d;var s=saldo(c);
  var m='Olá, '+c.nome.split(' ')[0]+'! Tudo bem? Passando para lembrar que consta em aberto '+R(s.t)+' aqui na loja'+(s.v?', sendo '+R(s.v)+' em atraso':'')+'. Qualquer dúvida, é só me chamar!';
  return'https://wa.me/'+d+'?text='+encodeURIComponent(m)}
function cliHTML(c){
  var s=saldo(c),h=hoje();
  var compras=c.compras.slice().sort(function(a,b){return b.data<a.data?-1:1}).map(function(x){
    var itens=x.itens.map(function(i){return'<div class="it">'+esc(i.q)+' × '+esc(i.d)+' — '+R(i.q*i.p)+'</div>'}).join('');
    var pars=x.parcelas.map(function(p,k){
      var atras=!p.pago&&p.venc<h;
      return'<div class="par '+(p.pago?'pago':'')+'"><div><b>'+(k+1)+'/'+x.parcelas.length+'</b> · '+BR(p.venc)+' '+(atras?'<span class="tag">atrasada</span>':'')+(p.pago?'<span class="tag ok">paga</span>':'')+'<div class="v">'+R(p.valor)+'</div>'+pagInfo(p)+'</div>'+
      '<button class="sm '+(p.pago?'s':'')+'" onclick="'+(p.pago?'pagar':'receber')+'(\''+c.id+'\',\''+x.id+'\','+k+')">'+(p.pago?'Desfazer':'Recebi')+'</button></div>'}).join('');
    return'<div class="card"><div class="row sp"><b>'+BR(x.data)+'</b><b>'+R(x.total)+'</b></div>'+itens+'<div style="margin-top:8px">'+pars+'</div>'+
    '<p style="margin:10px 0 0"><button class="d sm" onclick="delCompra(\''+c.id+'\',\''+x.id+'\')">Apagar compra</button></p></div>'}).join('');
  return'<button class="s sm" onclick="go(\'home\')">← Voltar</button>'+
  '<div class="row sp" style="margin:14px 0"><div><h2>'+esc(c.nome)+'</h2>'+(c.tel?'<div class="lbl">'+esc(c.tel)+'</div>':'')+'</div><button class="s sm" onclick="editCli(\''+c.id+'\')">Editar</button></div>'+
  '<div class="card"><div class="lbl">Ele(a) deve</div><div class="big">'+R(s.t)+'</div>'+(s.v?'<div class="bad"><b>'+R(s.v)+' atrasado</b></div>':'')+'</div>'+
  (s.t&&c.tel?'<a class="btn" href="'+zap(c)+'" target="_blank" rel="noopener">Cobrar pelo WhatsApp</a>':'')+'<button style="width:100%;margin-bottom:8px" onclick="novaCompra(\''+c.id+'\')">+ Nova compra no fiado</button><button class="s" style="width:100%;margin-bottom:14px" onclick="novaCompra(\''+c.id+'\',1)">+ Lançar saldo antigo da ficha</button>'+
  (compras||'<div class="empty">Nenhuma compra registrada.</div>');
}
function novoCli(){openM('<h2>Novo cliente</h2><label>Nome</label><input id="cn"><label>Telefone (opcional)</label><input id="ct" inputmode="tel"><p class="row"><button onclick="saveCli()">Salvar</button><button class="s" onclick="closeM()">Cancelar</button></p>');setTimeout(function(){document.getElementById('cn').focus()},50)}
function saveCli(id){var n=document.getElementById('cn').value.trim(),t=document.getElementById('ct').value.trim();if(!n)return document.getElementById('cn').focus();
  var c;if(id){c=db.clientes.find(function(x){return x.id===id});c.nome=n;c.tel=t}else{c={id:uid(),nome:n,tel:t,compras:[]};db.clientes.push(c)}
  saveC(c);closeM();render()}
function editCli(id){var c=db.clientes.find(function(x){return x.id===id});
  openM('<h2>Editar cliente</h2><label>Nome</label><input id="cn" value="'+esc(c.nome)+'"><label>Telefone</label><input id="ct" value="'+esc(c.tel)+'"><p class="row"><button onclick="saveCli(\''+id+'\')">Salvar</button><button class="s" onclick="closeM()">Cancelar</button></p><p><button class="d sm" onclick="delCli(\''+id+'\')">Apagar cliente</button></p>')}
function delCli(id){if(confirm('Apagar este cliente e todas as compras dele?')){db.clientes=db.clientes.filter(function(x){return x.id!==id});delC(id);closeM();go('home')}}
function pagar(cid,xid,k){var c=db.clientes.find(function(x){return x.id===cid}),x=c.compras.find(function(y){return y.id===xid}),p=x.parcelas[k];p.pago=false;p.rec=0;p.pags=[];delete p.pagoEm;saveC(c);render()}
function getP(cid,xid,k){var c=db.clientes.find(function(x){return x.id===cid});return{c:c,p:c.compras.find(function(y){return y.id===xid}).parcelas[k]}}
function pagInfo(p){if(!(p.rec>0))return'';var l=(p.pags||[]).map(function(x){return BR(x.d)+' — '+R(x.v)}).join(' · ');
  var s='<div class="lbl">'+(p.pago?'Paga':'Recebido '+R(p.rec)+', falta '+R(resta(p)))+(p.pago&&p.pagoEm&&p.pagoEm>p.venc?' com '+diasEntre(p.venc,p.pagoEm)+' dia(s) de atraso':'')+'</div>';
  return s+(l?'<div class="lbl">'+l+'</div>':'')}
function receber(cid,xid,k){var p=getP(cid,xid,k).p,h=hoje(),at=p.venc<h?diasEntre(p.venc,h):0,a="('"+cid+"','"+xid+"',"+k+")";
  openM('<h2>Receber</h2>'+(at?'<p class="bad"><b>Vencida há '+at+' dia(s) — era para '+BR(p.venc)+'</b></p>':'<p class="lbl">Vence em '+BR(p.venc)+'</p>')+
  '<p class="lbl">Falta '+R(resta(p))+' nesta parcela.</p><label>Valor recebido</label><input id="rv" inputmode="decimal" value="'+String(resta(p)).replace('.',',')+'"><label>Data do pagamento</label><input id="rd" type="date" value="'+h+'">'+
  '<p class="row"><button onclick="okRec'+a+'">Confirmar</button><button class="s" onclick="closeM()">Cancelar</button></p>'+
  '<div class="card"><label style="margin-top:0">Combinou outra data? Novo vencimento</label><input id="rn" type="date" value="'+p.venc+'"><p style="margin:10px 0 0"><button class="s sm" onclick="reag'+a+'">Reagendar</button></p></div>'+
  (p.rec>0?'<p><button class="d sm" onclick="closeM();pagar'+a+'">Zerar o que foi recebido</button></p>':''))}
function okRec(cid,xid,k){var o=getP(cid,xid,k),p=o.p,v=Math.min(num(document.getElementById('rv').value),resta(p)),d=document.getElementById('rd').value||hoje();if(v<=0)return;
  (p.pags=p.pags||[]).push({d:d,v:v});p.rec=Math.round(((p.rec||0)+v)*100)/100;if(p.rec>=p.valor-0.005){p.rec=p.valor;p.pago=true;p.pagoEm=d}saveC(o.c);closeM();render()}
function reag(cid,xid,k){var o=getP(cid,xid,k),n=document.getElementById('rn').value;if(!n)return;o.p.venc=n;saveC(o.c);closeM();render()}
function delCompra(cid,xid){if(confirm('Apagar esta compra?')){var c=db.clientes.find(function(x){return x.id===cid});c.compras=c.compras.filter(function(y){return y.id!==xid});saveC(c);render()}}

function novaCompra(cid,antigo){
  draft={cid:cid,itens:[{d:antigo?'Saldo da ficha':'',q:'1',p:''}],data:hoje(),venc:addM(hoje(),1),n:'1'};
  openM('<h2>Nova compra</h2><label>Itens</label><div id="its"></div><button class="s sm" onclick="addIt()">+ Item</button>'+
  '<div class="card" style="margin-top:12px"><div class="lbl">Total</div><div class="big" id="tt">R$ 0,00</div></div>'+
  '<label>Data da compra</label><input type="date" value="'+draft.data+'" onchange="draft.data=this.value;calc()">'+
  '<label>Número de parcelas</label><input inputmode="numeric" value="1" oninput="draft.n=this.value;calc()">'+
  '<label>Vencimento da 1ª parcela</label><input type="date" value="'+draft.venc+'" onchange="draft.venc=this.value;calc()">'+
  '<div class="lbl" id="pv" style="margin-top:8px"></div>'+
  '<p class="row"><button onclick="saveCompra()">Salvar compra</button><button class="s" onclick="closeM()">Cancelar</button></p>');
  its();calc()}
function its(){document.getElementById('its').innerHTML=draft.itens.map(function(i,k){
  return'<div class="irow"><input placeholder="Produto" value="'+esc(i.d)+'" oninput="draft.itens['+k+'].d=this.value"><input inputmode="decimal" placeholder="Qtd" value="'+esc(i.q)+'" oninput="draft.itens['+k+'].q=this.value;calc()"><input inputmode="decimal" placeholder="R$ un." value="'+esc(i.p)+'" oninput="draft.itens['+k+'].p=this.value;calc()"><button class="d" onclick="rmIt('+k+')" aria-label="Remover item">×</button></div>'}).join('')}
function addIt(){draft.itens.push({d:'',q:'1',p:''});its()}
function rmIt(k){if(draft.itens.length>1){draft.itens.splice(k,1);its();calc()}}
function totalC(){return Math.round(draft.itens.reduce(function(t,i){return t+num(i.q)*num(i.p)},0)*100)}
function calc(){var t=totalC(),n=Math.max(1,Math.min(60,parseInt(draft.n)||1));
  document.getElementById('tt').textContent=R(t/100);
  document.getElementById('pv').textContent=t?n+'× de '+R(Math.floor(t/n)/100)+', a partir de '+(draft.venc?BR(draft.venc):'—'):''}
function saveCompra(){
  var t=totalC(),n=Math.max(1,Math.min(60,parseInt(draft.n)||1));
  if(!t)return alert('Informe pelo menos um item com valor.');
  if(!draft.venc||!draft.data)return alert('Confira as datas.');
  var base=Math.floor(t/n),pars=[];
  for(var k=0;k<n;k++)pars.push({venc:addM(draft.venc,k),valor:(k===n-1?t-base*(n-1):base)/100,pago:false});
  var itens=draft.itens.filter(function(i){return num(i.p)>0}).map(function(i){return{d:i.d.trim()||'Item',q:num(i.q)||1,p:num(i.p)}});
  var c=db.clientes.find(function(x){return x.id===draft.cid});
  c.compras.push({id:uid(),data:draft.data,itens:itens,total:t/100,parcelas:pars});
  saveC(c);closeM();render()}

function backup(){openM('<h2>Cópia de segurança</h2><p class="lbl">Os dados ficam só neste aparelho. Copie o texto abaixo e guarde (por exemplo, mandando para você no WhatsApp).</p><textarea id="bk" readonly>'+esc(JSON.stringify(db))+'</textarea><p><button onclick="cp()">Copiar</button></p><label>Restaurar: cole aqui uma cópia</label><textarea id="rs"></textarea><p class="row"><button class="s" onclick="rest()">Restaurar</button><button class="s" onclick="closeM()">Fechar</button></p>')}
function cp(){var t=document.getElementById('bk');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}}
function rest(){try{var d=JSON.parse(document.getElementById('rs').value);if(!d.clientes)throw 0;if(confirm('Isto substitui os dados atuais. Continuar?')){db=d;replaceAll(d.clientes).then(function(){closeM();go('home')})}}catch(e){alert('Texto inválido.')}}
iniciar();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
