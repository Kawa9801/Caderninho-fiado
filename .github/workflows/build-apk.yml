name: Gerar APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar site
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js www/
          cp -r icons www/
      - name: Criar projeto Android
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Caderno do Fiado" io.github.kawa9801.fiado --web-dir www
          npx cap add android
          npx cap sync android
      - name: Chave fixa (para o app poder ser atualizado sem apagar dados)
        run: |
          mkdir -p ~/.android
          base64 -d fiado-keystore.b64 > ~/.android/debug.keystore
      - name: Compilar APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: caderno-do-fiado-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
